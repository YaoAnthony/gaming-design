name: Deploy climb to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['climb/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: climb } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: climb/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { GITHUB_PAGES: 'true' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: climb/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
